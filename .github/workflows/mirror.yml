name: Mirror to Personal Repo

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout organization repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify token exists
        env:
          PERSONAL_REPO_TOKEN: ${{ secrets.PERSONAL_REPO_TOKEN }}
        run: |
          if [ -z "$PERSONAL_REPO_TOKEN" ]; then
            echo "PERSONAL_REPO_TOKEN is missing or empty"
            exit 1
          fi
          echo "Token secret is available"

      - name: Push to personal repository
        env:
          PERSONAL_REPO_TOKEN: ${{ secrets.PERSONAL_REPO_TOKEN }}
        run: |
          git remote remove personal 2>/dev/null || true
          git remote add personal "https://sam-zarila:${PERSONAL_REPO_TOKEN}@github.com/sam-zarila/vero360.git"
          git push --force personal HEAD:main
